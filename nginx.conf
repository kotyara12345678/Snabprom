# SPA-раздача + security-заголовки + кеш статики + прокси API на backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Вложения заявок и сообщения чата (10 МБ + запас на multipart-обёртку)
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Healthcheck endpoint (сам nginx, без backend)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # API → FastAPI backend (uvicorn в контейнере backend:8000)
    location /api/ {
        # Имя backend резолвится на лету через DNS Docker: nginx стартует,
        # даже если контейнер backend ещё не поднялся, и не падает при его рестарте
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "http://backend:8000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI-модель может отвечать долго; файлы читаются и сохраняются
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_connect_timeout 5s;
    }

    # Долгий кеш хеш-именованных ассетов
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback + security-заголовки на HTML
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # robots.txt и sitemap — без кеша
    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }
}
