services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: snabpromtechmontazh-landing:latest
    container_name: snabprom-landing
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
